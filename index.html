<!DOCTYPE html>
<!--
  ============================================================
   index.html — "BUNGKUS" PWA UNTUK APLIKASI TO-DO LIST
   File ini di-hosting di GitHub Pages, lalu menampilkan
   Web App Google Apps Script di dalamnya (iframe) secara layar penuh.
  ============================================================
-->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Tugasku</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #4f46e5; overflow: hidden; }
    /* Layar pembuka selama aplikasi dimuat */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #fff; font-family: system-ui, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 24px; }
    #splash a { color: #fff; font-size: 13px; opacity: .85; display: none; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <div>Memuat Tugasku...</div>
    <!-- Muncul jika aplikasi lambat/gagal dimuat -->
    <a id="linkCadangan" href="#" target="_blank" rel="noopener">Tidak muncul? Ketuk untuk membuka di Chrome</a>
  </div>

  <iframe id="app" title="Tugasku" allow="clipboard-write"></iframe>

  <script>
    // ⚠️ GANTI dengan URL Web App Anda (yang berakhiran /exec)
    const URL_APP = 'https://script.google.com/macros/s/AKfycbxRlcQfambyOWEqlSTnfZkulHSufkvzLJ_-YTeWMT6MbLmOSLatUut13YgksRhXInbB/exec';

    document.getElementById('app').src = URL_APP;
    document.getElementById('linkCadangan').href = URL_APP;

    // Tampilkan tautan cadangan jika setelah 8 detik masih belum tampil
    setTimeout(() => { document.getElementById('linkCadangan').style.display = 'block'; }, 8000);

    // Daftarkan service worker (syarat agar bisa "Instal aplikasi")
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
